name: intima
description: INTIMA — Private Intimate Life & Wellness Tracker. A secure, offline-first, bilingual mobile application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Immutable models & serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Internationalization
  intl: ^0.20.2

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Biometric authentication
  local_auth: ^2.3.0

  # Secure storage for keys
  flutter_secure_storage: ^9.2.4

  # Cryptography (AES-256-GCM)
  pointycastle: ^3.9.1

  # File system
  path_provider: ^2.1.5

  # UUID generation
  uuid: ^4.5.1

  # Timezone for scheduled local notifications
  timezone: ^0.10.1

  # Charts
  fl_chart: ^0.69.0

  # Share / export
  share_plus: ^10.1.4

  # Cupertino icons
  cupertino_icons: ^1.0.8

  # Gap / spacing utility
  gap: ^3.0.1
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3

  # Linting
  flutter_lints: ^5.0.0

dependency_overrides:
  archive: ^4.5.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  generate: true
